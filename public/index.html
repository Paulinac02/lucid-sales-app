<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucid Sales — Generador de Información</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --border: #e4e2dc;
      --border-strong: #c9c7c0;
      --text: #1a1917;
      --muted: #6b6961;
      --accent: #7c3aed;
      --accent-light: #ede9fe;
      --accent-text: #5b21b6;
      --success: #059669;
      --success-light: #d1fae5;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .wrapper {
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent-text);
      margin-bottom: 1.5rem;
    }

    .logo-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    header p {
      font-size: 1rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .search-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .search-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-row input:focus {
      border-color: var(--accent);
    }

    .search-row input::placeholder { color: var(--muted); }

    .btn {
      height: 44px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) { opacity: 0.9; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
      margin-top: 12px;
    }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .results { display: flex; flex-direction: column; gap: 12px; }

    .field-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .field-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .field-icon {
      font-size: 15px;
    }

    .btn-copy {
      height: 30px;
      padding: 0 12px;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-copy:hover { border-color: var(--accent); color: var(--accent); }
    .btn-copy.copied { background: var(--success-light); color: var(--success); border-color: var(--success); }

    .field-body {
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      white-space: pre-wrap;
      font-family: 'DM Sans', sans-serif;
    }

    .skeleton .field-body {
      color: transparent;
      background: linear-gradient(90deg, var(--bg) 25%, var(--border) 50%, var(--bg) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 4px;
      min-height: 60px;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .product-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-light);
      color: var(--accent-text);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      color: #b91c1c;
      margin-top: 10px;
      display: none;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      header h1 { font-size: 1.5rem; }
      .search-row { flex-direction: column; }
      .btn { height: 44px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="logo">
        <div class="logo-dot"></div>
        Lucid Sales
      </div>
      <h1>Generador de información de producto</h1>
      <p>Pega el link de tu producto y obtén los textos listos para cada campo, con emojis incluidos.</p>
    </header>

    <div class="search-card">
      <label class="search-label" for="url-input">Link del producto</label>
      <div class="search-row">
        <input type="url" id="url-input" placeholder="https://tutienda.com/productos/nombre-del-producto" />
        <button class="btn btn-primary" id="analyze-btn" onclick="analyzeProduct()">Analizar →</button>
      </div>
      <div class="status-bar">
        <div class="spinner" id="spinner"></div>
        <span id="status-text"></span>
      </div>
      <div class="error-box" id="error-box"></div>
    </div>

    <div id="results-section" style="display:none;">
      <div class="product-badge" id="product-badge">🛒 <span id="product-name"></span></div>
      <div class="results" id="results"></div>
    </div>

    <footer>Generado con IA · Solo para uso interno</footer>
  </div>

  <script>
    const FIELDS = [
      { key: 'descripcion',         icon: '✨', label: 'Descripción' },
      { key: 'modo_uso',            icon: '🔧', label: 'Modo de uso' },
      { key: 'caracteristicas',     icon: '⚙️', label: 'Características técnicas' },
      { key: 'contenido_paquete',   icon: '📦', label: 'Contenido del paquete' },
      { key: 'preguntas_frecuentes',icon: '❓', label: 'Preguntas frecuentes' },
      { key: 'preguntas_postventa', icon: '🔄', label: 'Preguntas frecuentes post-venta' },
    ];

    function setStatus(msg) {
      document.getElementById('status-text').textContent = msg;
    }

    function setLoading(loading) {
      document.getElementById('spinner').style.display = loading ? 'block' : 'none';
      document.getElementById('analyze-btn').disabled = loading;
    }

    function showError(msg) {
      const box = document.getElementById('error-box');
      box.textContent = '⚠️ ' + msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error-box').style.display = 'none';
    }

    function renderSkeletons() {
      const container = document.getElementById('results');
      container.innerHTML = FIELDS.map(f => `
        <div class="field-card skeleton" id="card-${f.key}">
          <div class="field-head">
            <div class="field-name"><span class="field-icon">${f.icon}</span>${f.label}</div>
          </div>
          <div class="field-body">Cargando contenido...</div>
        </div>
      `).join('');
      document.getElementById('results-section').style.display = 'block';
    }

    function fillCard(key, text) {
      const card = document.getElementById('card-' + key);
      if (!card) return;
      card.classList.remove('skeleton');
      card.querySelector('.field-body').textContent = text;

      const head = card.querySelector('.field-head');
      if (!head.querySelector('.btn-copy')) {
        const btn = document.createElement('button');
        btn.className = 'btn-copy';
        btn.innerHTML = '📋 Copiar';
        btn.onclick = () => {
          navigator.clipboard.writeText(text).then(() => {
            btn.innerHTML = '✅ Copiado';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.innerHTML = '📋 Copiar';
              btn.classList.remove('copied');
            }, 2000);
          });
        };
        head.appendChild(btn);
      }
    }

    async function analyzeProduct() {
      const url = document.getElementById('url-input').value.trim();
      if (!url || !url.startsWith('http')) {
        showError('Por favor ingresa una URL válida (debe comenzar con http o https).');
        return;
      }

      hideError();
      setLoading(true);
      setStatus('Analizando producto...');
      renderSkeletons();
      document.getElementById('results-section').style.display = 'block';
      document.getElementById('product-name').textContent = '';

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Error al analizar el producto');
        }

        if (data.nombre) {
          document.getElementById('product-name').textContent = data.nombre;
        }

        FIELDS.forEach(f => {
          fillCard(f.key, data[f.key] || 'No se pudo generar este campo.');
        });

        setStatus('¡Listo! Copia cada texto al campo correspondiente en Lucid Sales.');
      } catch (err) {
        showError(err.message);
        setStatus('');
        document.getElementById('results-section').style.display = 'none';
      } finally {
        setLoading(false);
      }
    }

    document.getElementById('url-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') analyzeProduct();
    });
  </script>
</body>
</html>
